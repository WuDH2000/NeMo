model:
  pretrained_llm: Qwen/Qwen2.5-7B
  pretrained_audio_codec: /home/i-wudonghang/data/duplex_s2s/ckpt/Low_Frame-rate_Speech_Codec++_without_speaker_encoder.nemo
  pretrained_asr: /home/i-wudonghang/data/duplex_s2s/ckpt/oci-N-8_G-8_cacheaware-600M_granary-gsc_PC_multilookahead.nemo
  scoring_asr: stt_en_fastconformer_transducer_large
  # pretrained_fsdp_s2s_model: /mnt/donghang-jfs/duplex/exp/results/lat_elbo_alldata_logits_cotpred_noaudio/checkpoints/step=1400-last.ckpt/
  # pretrained_tts_from_s2s: /lustre/fsw/llmservice_nemo_speechlm/users/cchen1/code/s2s-july/pretrained_ckpt/tts-pretraining_qwnen_2.5_81007_steps.ckpt
  # pretrained_s2s_model: /mnt/donghang-jfs/duplex/exp/results/duplex_token_clsrc_fromdial_ac40_keepnodes_removeconf/store_ckpt/step=5375.ckpt
  # pretrained_s2s_model: /mnt/donghang-jfs/duplex/exp/results/duplex_wosrc_fromdial_ac40_keepnodes_removeconf/store_ckpt/step=5175.ckpt
  
  audio_loss_weight: 0
  text_loss_weight: 1.0
  cot_classification_loss_weight: 5.0  # Weight for COT/response binary classification loss
  mse_reconstruction_loss_weight: 3.0  # Weight for MSE reconstruction loss in ELBO approach
  if_force_cot_label: false
  non_causal_encoder_num_layers: 3
  non_causal_encoder_type: transformer

  freeze_params:
    - "^audio_codec\\..+$"  # Keep audio codec frozen as it only provides supervision for training.
  prevent_freeze_params: []

  pretrained_weights: true
  # Semantic Predictor Configuration
  # Set to true to use Transformer (with temporal modeling), false for MLP (lightweight)
  use_transformer_semantic_predictor: true
  
  # Transformer Semantic Predictor parameters (used when use_transformer_semantic_predictor=true)
  semantic_predictor_d_model: 1024
  semantic_predictor_n_heads: 8
  semantic_predictor_n_layers: 4
  semantic_predictor_n_cond_layers: 2
  semantic_predictor_dim_feedforward: 2048
  semantic_predictor_max_seq_len: 4096
  
  # MLP Semantic Predictor parameters (used when use_transformer_semantic_predictor=false)
  semantic_predictor_hidden_dim: 512
  
  # Shared parameters
  semantic_predictor_dropout: 0.1
  semantic_temperature: 0.9
  semantic_topk: 20
  pretrained_flow: /home/i-wudonghang/data/duplex_s2s/ckpt/flow
  text_to_text_loss_weight: 0.2   # audio data loss weight is: 1 - this value

  duplex_user_channel_weight: 1.0
  text_embedding_weight: 1.0
  audio_save_path: ${exp_manager.explicit_log_dir}/pred_audios

  use_gated_fusion: false
  noise_prob: 0.0
  noise_file_path: '/lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_speechlm/data/duplex/dns5/dns5_demand_noise/'

  mask_sequence_loss: false  # set the mask based on the target_token_lens to disconsider sequence padding in loss
  token_loss_weight:
    bos: 10.0
    eos: 5.0
    pad: 1.0
    text: 1.0
  use_chunked_audio_loss: true
  perception:
     target: nemo.collections.speechlm2.modules.perception.AudioPerceptionModule

     preprocessor:
       normalize: 'NA'

     encoder:
       self_attention_model:
       att_context_size: [70,0]
       conv_context_size: causal
       conv_norm_type: layer_norm

     modality_adapter:
       _target_: nemo.collections.speechlm2.modules.perception.IdentityConnector
       d_model: 1024

     spec_augment:
      _target_: nemo.collections.asr.modules.SpectrogramAugmentation
      freq_masks: 2 # set to zero to disable it
      time_masks: 20 # set to zero to disable it
      freq_width: 27
      time_width: 5
      
  optimizer:
    _target_: torch.optim.AdamW
    lr: 3e-4 #3e-4
    betas: [0.9, 0.98]
    weight_decay: 0
    foreach: false # set to false if having issues with tensor-parallelism

  lr_scheduler:
    _target_: nemo.core.optim.lr_scheduler.InverseSquareRootAnnealing
    warmup_steps: 2500 #2500
    min_lr: 5e-6
    max_steps: ${trainer.max_steps}

trainer:
  devices: -1
  accelerator: gpu
  num_nodes: 1
  precision: bf16-true
  logger: False # logger provided by exp_manager
  enable_checkpointing: False
  use_distributed_sampler: False
  max_steps: 10000000
  val_check_interval: 2000
  limit_train_batches: ${trainer.val_check_interval}  # an "epoch"
  limit_val_batches: 1
  log_every_n_steps: 10
  num_sanity_val_steps: 0
  # gradient_clip_val: 1.0
  gradient_clip_algorithm: "value"  # Use value-based clipping for FSDP compatibility  # Reduce from 40 to 20 due to ELBO memory overhead
  accumulate_grad_batches: 20
  strategy:
    _target_: lightning.pytorch.strategies.ModelParallelStrategy
    tensor_parallel_size: 1
    data_parallel_size: 8
#    _target_: lightning.pytorch.strategies.DDPStrategy
#    gradient_as_bucket_view: true
#    find_unused_parameters: true

data:
  frame_length: 0.08
  source_sample_rate: 16000
