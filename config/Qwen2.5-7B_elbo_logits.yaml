  validation_ds:
    datasets:
      cot_data_llama_q_nointer:
        shar_path: /mnt/donghang-jfs/duplex/shard_llama_q_fixcot_small_filtered_interruption0/val
      cot_data_spokenwoz_nointer:
        shar_path: /mnt/donghang-jfs/duplex/shard_ToD_spokenwoz_fixcot_small_filtered_interruption0/val
